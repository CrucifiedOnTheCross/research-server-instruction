experiment:
  name: stage15a_offline_crop_convnext_small_384
  notes: "Stage 15A arm B: exact offline 512 center crop, no VAE or denoising."

runtime:
  deterministic: true

data:
  root: /srv/research/projects/default/ham10000
  train_csv: splits/stage15a/train_offline_crop.csv
  val_csv: splits/stage8/val_real.csv
  test_csv: splits/stage8/locked_test_real.csv
  image_size: 384
  val_size: 384

model:
  name: convnext_small.fb_in22k_ft_in1k_384
  drop_path_rate: 0.2

augmentation:
  eval:
    resize: 438
    center_crop: true

training:
  epochs: 80
  batch_size: 32
  accumulation_steps: 1
  lr: 0.0001
  layer_decay: 0.925
  warmup_epochs: 5
  early_stopping_patience: 15
  monitor: val/auprc_ovr_macro
  monitor_mode: max
  label_smoothing: 0.05
  model_ema: true
  model_ema_decay: 0.9999
  model_ema_warmup: true
  synthetic_weight: 0.5
  synthetic_weight_per_class:
    mel: 0.5
    akiec: 0.5
    bkl: 0.5
  save_last_checkpoint: false
  checkpoint_include_optimizer: false

imbalance:
  sampler: none
  loss: cross_entropy
  class_weights: none

evaluation:
  primary_metric: auprc_ovr_macro
  run_test: false
