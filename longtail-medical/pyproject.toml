[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "longtail-medical"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "scikit-learn>=1.5,<2",
  "torch>=2.7,<3",
  "torchvision>=0.22,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

