experiment:
  name: stage16_isic2019_real_ce_natural_384
  notes: "Stage 16B real-only natural-sampling ISIC 2019 baseline; internal locked test disabled."

runtime:
  deterministic: true
  num_workers: 16

data:
  root: /srv/research/projects/default/isic2019
  train_csv: splits/train.csv
  val_csv: splits/val.csv
  test_csv: splits/locked_test.csv
  class_map:
    mel: 0
    nv: 1
    bcc: 2
    ak: 3
    bkl: 4
    df: 5
    vasc: 6
    scc: 7
  image_size: 384
  val_size: 384

model:
  name: convnext_small.fb_in22k_ft_in1k_384
  drop_path_rate: 0.2

augmentation:
  eval:
    resize: 438
    center_crop: true

training:
  epochs: 60
  batch_size: 64
  accumulation_steps: 1
  lr: 0.0001
  layer_decay: 0.925
  warmup_epochs: 5
  early_stopping_patience: 12
  monitor: val/auprc_ovr_macro
  monitor_mode: max
  label_smoothing: 0.05
  model_ema: true
  model_ema_decay: 0.9999
  model_ema_warmup: true
  save_last_checkpoint: false
  checkpoint_include_optimizer: false

imbalance:
  sampler: none
  loss: cross_entropy
  class_weights: none

evaluation:
  primary_metric: auprc_ovr_macro
  run_test: false

tracking:
  experiment: ISIC2019 Stage16
