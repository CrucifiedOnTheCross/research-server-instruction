experiment:
  name: stage9_crt_weighted_384
  notes: "Stage 9A cRT: frozen natural CE representation and reinitialized balanced classifier."

runtime:
  deterministic: true

data:
  root: /srv/research/projects/default/ham10000
  train_csv: splits/stage8/train_real.csv
  val_csv: splits/stage8/val_real.csv
  test_csv: splits/stage8/locked_test_real.csv
  image_size: 384
  val_size: 384

model:
  name: convnext_base.fb_in22k_ft_in1k_384
  initial_checkpoint: null
  drop_path_rate: 0.2

augmentation:
  eval:
    resize: 438
    center_crop: true

training:
  epochs: 30
  batch_size: 96
  accumulation_steps: 1
  optimizer: sgd
  lr: 0.01
  weight_decay: 0.0
  warmup_epochs: 1
  min_lr: 0.00001
  early_stopping_patience: 8
  classifier_only: true
  reinitialize_classifier: true
  save_last_checkpoint: false
  checkpoint_include_optimizer: false

imbalance:
  sampler: weighted
  loss: cross_entropy
  class_weights: none

evaluation:
  run_test: false
