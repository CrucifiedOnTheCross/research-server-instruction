status: approved
stage10_analysis_reviewed: true
decision_date: "2026-07-28"
decision_rationale: "Branch B with Branch D guardrails: strict_id improved MCC with lesion-bootstrap CI above zero and macro AUPRC on 3/3 seeds, but macro F1 CI crossed zero and mel recall decreased. Stage 11A qualifies the real-only baseline before one strict_id-versus-replay Stage 11B transfer test."

required_stage10:
  seeds: [42, 43, 44]
  strata: [strict_id, aid_radial, ood_far, random_remaining]
  arms: [synthetic, replay]

stage11:
  seeds: [42, 43, 44]
  stage11a_status: complete
  selected_stage10_stratum: strict_id
  selected_baseline: configs/ham10000_stage11_convnext_small_regularized_384.yaml
  secondary_architecture: configs/ham10000_stage11_dinov2_base_finetune_392.yaml
  stage11b_status: approved_not_started
  stage11b_comparison: synthetic_strict_id_vs_source_matched_replay
  stage11b_seeds: [42, 43, 44]
  stage11b_configs:
    - configs/ham10000_stage11b_replay_strict_id_convnext_small_384.yaml
    - configs/ham10000_stage11b_synthetic_strict_id_convnext_small_384.yaml
  stage11b_rationale: "Use ConvNeXt-S: it beats ConvNeXt-B on macro F1, MCC, balanced accuracy and macro AUPRC on all three matched seeds while using 49.5M instead of 87.6M parameters. DINOv2 full has higher macro F1 than the old anchor but lower MCC and melanoma F1/AUPRC than ConvNeXt-S, so it remains a secondary representation-sensitivity analysis."
  enabled_configs:
    - configs/ham10000_stage11_convnext_base_regularized_384.yaml
    - configs/ham10000_stage11_convnext_small_regularized_384.yaml
    - configs/ham10000_stage11_dinov2_base_linear_392.yaml
    - configs/ham10000_stage11_dinov2_base_finetune_392.yaml

decision_rules:
  retain_stage10_geometry_arm: "Retain strict_id only; do not carry aid_radial, ood_far or random_remaining into Stage 11B."
  baseline_promotion: "ConvNeXt-S is promoted after three matched seeds and lesion-group analysis; DINOv2 full is retained only as a secondary architecture result."
  locked_test: "Keep evaluation.run_test=false during Stage 11 screening."
