experiment:
  name: stage11_real_dinov2_base_finetune_392
  notes: "Stage 11 architecture control: full DINOv2 ViT-B/14 fine-tuning with effective batch 32."

runtime:
  deterministic: true

data:
  root: /srv/research/projects/default/ham10000
  train_csv: splits/stage8/train_real.csv
  val_csv: splits/stage8/val_real.csv
  test_csv: splits/stage8/locked_test_real.csv
  image_size: 392
  val_size: 392

model:
  name: vit_base_patch14_dinov2.lvd142m
  img_size: 392
  drop_path_rate: 0.1

augmentation:
  eval:
    resize: 448
    center_crop: true

training:
  epochs: 80
  batch_size: 16
  accumulation_steps: 2
  lr: 0.00005
  layer_decay: 0.75
  warmup_epochs: 5
  early_stopping_patience: 15
  label_smoothing: 0.05
  model_ema: true
  model_ema_decay: 0.9999
  model_ema_warmup: true
  save_last_checkpoint: false
  checkpoint_include_optimizer: false

imbalance:
  sampler: none
  loss: cross_entropy
  class_weights: none

evaluation:
  run_test: false
